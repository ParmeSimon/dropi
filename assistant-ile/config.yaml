# ============================================================
#  Configuration de ton assistant — modifie ce fichier librement
# ============================================================

# ---------- IA locale ----------
# Le moteur (llama.cpp) est livré avec l'appli : rien d'autre à installer. Au premier lancement, le modèle
# (Qwen3 8B, ~5 Go) est téléchargé une seule fois ; si Ollama l'a déjà sur ce PC, il est réutilisé.
# modele_fichier: D:/modeles/mon-modele.gguf   # pour utiliser un autre fichier .gguf
# modele_url: https://...                      # ou un autre lien de téléchargement
# Le modèle « réfléchit » avant de répondre : mieux sur les questions difficiles, mais bien plus lent.
reflexion: false
# Carte graphique : auto = le modèle y va si elle est libre, sinon (jeu, vidéo…) il reste sur le processeur ;
#                   non = toujours le processeur ; oui = toujours la carte (même occupée).
ia_gpu: auto
# Combien de temps le modèle reste en mémoire (≈ 6 Go) après ta dernière demande. Ensuite il est déchargé
# pour rendre la RAM au PC, et revient tout seul à la demande suivante (quelques secondes, pas de minutes).
garder_en_memoire: 15m
# Au lancement, charger le modèle en avance : la première demande est rapide.
prechauffer_ia: true
# Réglages avancés (laisse vide : c'est calculé pour ton PC)
# ia_threads: 3        # cœurs du processeur utilisés (par défaut : tous sauf un)
# ia_contexte: 6144    # taille de la mémoire de conversation (plus grand = plus de RAM)

# Reconnaissance vocale (Whisper) : tiny, base, small, medium
whisper_modele: small
langue: fr

# ---------- Rangement par thème ----------
# Chaque fichier va dans THÈME / SOUS-THÈME / ANNÉE, sous le dossier « racine » :
#   avis d'imposition (PDF)     -> Documents/Dropi/03 Administratif/Impôts/2026/
#   chapitre-3.pdf (Moodle)     -> Documents/Dropi/01 Études/Cours/2026/
#   capture d'écran             -> Documents/Dropi/04 Perso/Captures d'écran/2026/
# Dropi lit le nom du fichier, le site d'où il vient et le début de son contenu (PDF, Word, texte). Si c'est encore
# flou (ex : scan0042.pdf), le fichier attend dans « 99 À trier » et l'IA locale le classe en tâche de fond.
# Tout est noté dans journal_rangement.json : « annule » défait le dernier déplacement.
# « Réorganise mon classement » range d'un coup l'ancien classement (Documents/Classement…) dans les thèmes.
classement:
  mode: theme                       # theme (nouveau) | type (l'ancien : PDF/Gmail…)
  racine: ~/Documents/Dropi
  ia: true                          # false : jamais d'IA pour classer (les fichiers flous restent dans « À trier »)
  # Noms lisibles pour tes sites (les plus connus sont déjà reconnus : Gmail, Discord, WhatsApp…)
  sources:
    mail.google.com: Gmail
    # monlycee.net: Lycée
  # Mode « type » seulement : sous-dossiers et dossiers par type
  # modele: "{source}"
  # types:
  #   PDF: {dossier: ~/Documents/Classement/PDF, extensions: [.pdf]}

# ---------- Téléchargements ----------
# Quand un téléchargement se termine, la goutte te propose où le ranger.
#   auto     : Dropi range chaque fichier tout seul, un par un, 10 secondes après la fin du téléchargement
#              (dans son thème, voir « Rangement par thème » ; « annule » remet tout en place)
#   ouvrir   : le panneau s'ouvre tout seul avec le fichier (Résumer, Ranger ici, Ouvrir…), sans voler le clavier
#   proposer : elle te montre l'endroit sur la goutte, tu cliques pour ouvrir le panneau
#   rien     : elle ne surveille pas
telechargements:
  mode: auto
  dossier: ~/Downloads

# ---------- Tableau de bord ----------
# Dropi en plein écran, à la place du bureau et de la barre des tâches : tes applis, tes jeux, tes fichiers rangés,
# les fenêtres ouvertes. On l'ouvre avec le bouton « plein écran » de la goutte, le raccourci, ou « tableau de bord ».
# La pastille du haut (ou Échap) le referme dans la goutte.
tableau:
  raccourci: ctrl+alt+d            # ouvre / ramène devant / réduit. « non » pour ne pas réserver de raccourci
  au_lancement: comme avant        # comme avant (rouvert s'il était ouvert) | oui (toujours) | non (jamais)
  masquer_barre_windows: true      # tant qu'il est ouvert, la barre des tâches de Windows se cache toute seule
                                   # (elle revient si tu pousses la souris en bas, et à la fermeture)

# ---------- Comportement ----------
# En jeu ou devant une vidéo en plein écran, la goutte se cache (elle revient après).
masquer_en_plein_ecran: true

# ---------- Musique ----------
# La musique en cours s'affiche sur la goutte : cover à gauche, titre, artiste, temps à droite.
# Clique sur la cover pour mettre en pause.
musique:
  afficher: true
  # applis suivies : ajoute chrome, msedge ou brave pour YouTube… ou mets [toutes]
  applis: [AppleMusic, iTunes, Spotify]

# ---------- Mots de passe ----------
# Quand tu cliques dans un champ « mot de passe » de ton navigateur, la goutte te propose de le remplir
# (site déjà connu) ou d'en enregistrer un (elle te propose un mot de passe robuste).
# Ils sont gardés, chiffrés, dans le Gestionnaire d'identifiants de Windows : jamais dans un fichier, jamais vus par l'IA.
mots_de_passe:
  activer: true
  navigateurs: [chrome, brave, msedge]
  longueur: 20          # taille des mots de passe proposés
  # Avec l'extension (dossier extension/, voir LISEZMOI) : quand tu te connectes à un site,
  # l'identifiant et le mot de passe sont retenus tout seuls. false = seulement quand tu le demandes.
  capture: true

# ---------- Twitch ----------
# surnom -> nom de la chaîne Twitch (ce qui suit twitch.tv/)
streamers:
  kameto: kamet0
  kamet0: kamet0
  zerator: zerator
  gotaga: gotaga

# ---------- Sites favoris ----------
sites:
  youtube: https://www.youtube.com
  gmail: https://mail.google.com
  netflix: https://www.netflix.com

# ---------- Applications ----------
# Les applications installées (menu Démarrer, Microsoft Store) sont trouvées toutes seules, comme les jeux Steam.
# Cette liste sert seulement aux surnoms et aux cas particuliers : nom -> chemin de l'exécutable.
# Une ligne dont le programme n'est pas installé sur ce PC est ignorée.
applications:
  discord: "%LOCALAPPDATA%/Discord/Update.exe --processStart Discord.exe"
  spotify: "%APPDATA%/Spotify/Spotify.exe"
  bloc-notes: notepad
  calculatrice: calc
  explorateur: explorer

# Jeux hors Steam (Epic, Riot, Battle.net…) : nom -> chemin ou lien
jeux:
  league of legends: "C:/Riot Games/Riot Client/RiotClientServices.exe --launch-product=league_of_legends --launch-patchline=live"
  lol: "C:/Riot Games/Riot Client/RiotClientServices.exe --launch-product=league_of_legends --launch-patchline=live"
  valorant: "C:/Riot Games/Riot Client/RiotClientServices.exe --launch-product=valorant --launch-patchline=live"

# Dossiers Steam supplémentaires si Steam n'est pas au chemin par défaut
steam_dossiers: []

# ---------- Mails ----------
# Plus besoin de cette section : connecte ta messagerie depuis la goutte (tuile « Connecter mes mails »),
# le mot de passe va dans le coffre de Windows au lieu de ce fichier. Elle reste lue si elle est remplie.
email:
  serveur_imap: imap.gmail.com
  adresse: ""
  mot_de_passe_app: ""
